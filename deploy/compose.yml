name: douyin

services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - /srv/douyin:/srv/douyin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.5
    logging:
      options:
        max-size: '10m'
        max-file: '3'
