# 独立容器内的站点；宿主机只开放 127.0.0.1:8088，由现有 Caddy 提供 HTTPS。
server {
    listen 80;
    server_name dy.sunshinedairy.net;
    root /srv/douyin/current;
    index index.html;

    location = /version.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /js/ {
        alias /srv/douyin/shared/js/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        alias /srv/douyin/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
